name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verilog:
    name: RTL compile (Icarus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile the BradVector core
        run: iverilog -g2012 -t null -o elab.out rtl/verilog/bradvector_core.v

  toolchain:
    name: Toolchain build + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: >
          cmake -S toolchain -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBRAD_BUILD_DRIVERS=ON
          -DBRAD_BUILD_BVECTOR=ON
          -DBRAD_BUILD_BVLIB=ON
          -DBRAD_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: The binary must report the version CMake declares
        # Guards against the binary claiming a version the build does not agree
        # with. Version is injected from project(... VERSION ...) at compile time,
        # so this is a real check rather than a string comparison of two copies.
        run: |
          set -euo pipefail
          CMAKE_VER="$(sed -nE 's/.*project\([^)]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' toolchain/CMakeLists.txt | head -1)"
          REPORTED="$(./build/braddev/braddev version | head -1)"
          echo "cmake declares: $CMAKE_VER"
          echo "binary reports: $REPORTED"
          case "$REPORTED" in
            *"v$CMAKE_VER"*) echo "ok: the binary agrees with the build system" ;;
            *) echo "::error::binary reports '$REPORTED' but CMake declares $CMAKE_VER"; exit 1 ;;
          esac

  bradsense-metrics:
    # M2 gate: a renderer regression should be distinguishable from a compile
    # break, so the metrics check is its own job and diffs against the golden.
    name: BradSense metrics (golden diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: >
          cmake -S toolchain -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBRAD_BUILD_BVECTOR=ON
          -DBRAD_BUILD_BVLIB=ON
          -DBRAD_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: ctest
        run: ctest --test-dir build --output-on-failure
